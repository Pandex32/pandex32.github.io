<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal AI Analyser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="laa-app">
    <header class="laa-header">
      <h1>Legal Document Analyser</h1>
      <p>Upload a PDF or text file, paste a clause, and run a local legal analysis.</p>
    </header>

    <nav class="laa-tabs" aria-label="Demo tabs">
      <button class="laa-tab active" data-tab="analyse">Full Analysis</button>
      <button class="laa-tab" data-tab="risks">Risk Assessment</button>
      <button class="laa-tab" data-tab="missing">Missing Clauses</button>
      <button class="laa-tab" data-tab="dates">Key Dates</button>
      <button class="laa-tab" data-tab="summary">Plain Summary</button>
      <button class="laa-tab" data-tab="generate">Contract Generator</button>
    </nav>

    <div class="laa-grid">
      <section class="laa-input">
        <div class="laa-panel active" id="panel-analyse">
          <label>Document text</label>
          <textarea id="text-analyse" placeholder="Paste a contract or document for full analysis..."></textarea>
          <button class="laa-action" data-action="analyse">Analyse Contract</button>
        </div>
        <div class="laa-panel" id="panel-risks">
          <label>Contract text</label>
          <textarea id="text-risks" placeholder="Paste contract text to assess risks..."></textarea>
          <button class="laa-action" data-action="risks">Assess Risks</button>
        </div>
        <div class="laa-panel" id="panel-missing">
          <label>Contract text</label>
          <textarea id="text-missing" placeholder="Paste contract text to detect missing clauses..."></textarea>
          <button class="laa-action" data-action="missing">Detect Missing Clauses</button>
        </div>
        <div class="laa-panel" id="panel-dates">
          <label>Document text</label>
          <textarea id="text-dates" placeholder="Paste document text to extract key dates..."></textarea>
          <button class="laa-action" data-action="dates">Extract Dates</button>
        </div>
        <div class="laa-panel" id="panel-summary">
          <label>Document text</label>
          <textarea id="text-summary" placeholder="Paste document text for a plain-English summary..."></textarea>
          <button class="laa-action" data-action="summary">Summarise Document</button>
        </div>
        <div class="laa-panel" id="panel-generate">
          <label for="contract-type">Contract type</label>
          <select id="contract-type"></select>
          <div id="contract-fields"></div>
          <button class="laa-action" id="generate-contract">Generate Contract</button>
        </div>

        <div class="laa-upload" id="upload-zone">
          <strong>Upload document</strong>
          <span>PDF or TXT, up to 10 MB</span>
          <input type="file" id="document-file" accept=".pdf,.txt,application/pdf,text/plain">
          <button type="button" id="choose-file">Choose File</button>
          <div id="file-status"></div>
        </div>
      </section>

      <section class="laa-output">
        <div id="placeholder">
          <div class="laa-placeholder-icon">§</div>
          <p>Upload a PDF or text file, then choose an action.</p>
        </div>
        <div id="loading" hidden><div class="laa-spinner"></div><p>Preparing local analysis...</p></div>
        <article id="results" hidden></article>
        <button id="open-sign" class="laa-sign-button" hidden>Sign This Contract</button>
      </section>
    </div>
  </main>

  <div id="signature-modal" class="laa-modal" hidden>
    <div class="laa-sign-box">
      <header class="laa-sign-header">
        <div><h2>Sign Contract</h2><p>Both parties must sign.</p></div>
        <button id="close-sign" type="button" aria-label="Close">×</button>
      </header>
      <div class="laa-sign-body">
        <div class="laa-party-grid">
          <div><label>Party A — Full legal name</label><input id="party-a-name" type="text"><label>Email (optional)</label><input id="party-a-email" type="email"></div>
          <div><label>Party B — Full legal name</label><input id="party-b-name" type="text"><label>Email (optional)</label><input id="party-b-email" type="email"></div>
        </div>
        <div class="laa-sign-mode">
          <button class="active" data-mode="draw" type="button">Draw Signature</button>
          <button data-mode="type" type="button">Type Signature</button>
        </div>
        <div id="draw-mode">
          <div class="laa-pad-grid">
            <div><label>Party A — Draw</label><canvas id="canvas-a" width="320" height="110"></canvas><button type="button" data-clear="canvas-a">Clear</button></div>
            <div><label>Party B — Draw</label><canvas id="canvas-b" width="320" height="110"></canvas><button type="button" data-clear="canvas-b">Clear</button></div>
          </div>
        </div>
        <div id="type-mode" hidden>
          <div class="laa-pad-grid">
            <div><label>Party A — Type Name</label><input id="type-a" type="text"></div>
            <div><label>Party B — Type Name</label><input id="type-b" type="text"></div>
          </div>
        </div>
        <p id="sign-error" class="laa-sign-error" hidden></p>
        <div class="laa-sign-actions">
          <button id="download-signed" type="button">Sign &amp; Download PDF</button>
          <button id="print-signed" type="button">Print Contract</button>
          <button id="cancel-sign" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
