<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Document Analyser</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="laa-app">
    <header class="laa-header"><h1>Legal Document Analyser</h1></header>
    <nav class="laa-tabs" aria-label="Legal analysis modes">
      <button class="laa-tab active" data-tab="analysis">Full Analysis</button>
      <button class="laa-tab" data-tab="risk">Risk Assessment</button>
      <button class="laa-tab" data-tab="missing">Missing Clauses</button>
      <button class="laa-tab" data-tab="dates">Key Dates</button>
      <button class="laa-tab" data-tab="summary">Plain Summary</button>
      <button class="laa-tab" data-tab="generate">Generate Contract</button>
    </nav>
    <div class="laa-grid">
      <section class="laa-panel laa-input">
        <div class="laa-upload">
          <label for="contract-file">Upload .txt or .md contract</label>
          <input id="contract-file" type="file" accept=".txt,.md,text/plain,text/markdown">
        </div>
        <button id="load-sample" class="laa-secondary" type="button">Load Sample UK Contract</button>
        <div id="analysis-controls">
          <label for="contract-text">Contract text</label>
          <textarea id="contract-text" placeholder="Paste contract text here..."></textarea>
          <button id="analyse-button" class="laa-primary" type="button">Run Analysis</button>
        </div>
        <form id="generator-form" hidden>
          <h2>Contract Details</h2>
          <label for="contract-type">Contract Type</label>
          <select id="contract-type">
            <option>Service Agreement</option>
            <option>Employment Contract</option>
            <option>Non-Disclosure Agreement</option>
            <option>Software Licence Agreement</option>
            <option>Consultancy Agreement</option>
          </select>
          <label for="party-a">Party A</label>
          <input id="party-a" type="text" placeholder="Full legal name">
          <label for="party-b">Party B</label>
          <input id="party-b" type="text" placeholder="Full legal name">
          <label for="scope-details">Scope / Details</label>
          <textarea id="scope-details" placeholder="Services, duration, payment terms, governing jurisdiction..."></textarea>
          <button id="generate-button" class="laa-primary" type="button">Generate Contract</button>
        </form>
      </section>
      <section class="laa-panel laa-output">
        <div id="results-placeholder">
          <div class="laa-section-mark">§</div>
          <p>Choose a tab and run an analysis or generate a contract.</p>
        </div>
        <article id="results" hidden></article>
        <section id="signature-section" hidden>
          <h2>Dual-Party Electronic Signatures</h2>
          <div class="laa-signatures">
            <div>
              <label for="canvas-a">Party A Signature</label>
              <canvas id="canvas-a" width="320" height="150"></canvas>
              <button type="button" class="laa-clear" data-canvas="canvas-a">Clear</button>
            </div>
            <div>
              <label for="canvas-b">Party B Signature</label>
              <canvas id="canvas-b" width="320" height="150"></canvas>
              <button type="button" class="laa-clear" data-canvas="canvas-b">Clear</button>
            </div>
          </div>
          <button id="apply-signatures" class="laa-primary" type="button">Apply Signatures &amp; Print PDF</button>
        </section>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
